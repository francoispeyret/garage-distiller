name: Signed desktop release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
    runs-on: ${{ matrix.os }}
    env:
      GARAGE_DISTILLER_UPDATE_PUBLIC_KEY_HEX: ${{ vars.GARAGE_DISTILLER_UPDATE_PUBLIC_KEY_HEX }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release identity and public key
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Only stable versions are released'
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match Cargo.toml'
          key = os.environ['GARAGE_DISTILLER_UPDATE_PUBLIC_KEY_HEX']
          assert re.fullmatch(r'[0-9a-fA-F]{64}', key) and int(key, 16), 'Configure the public update key repository variable'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'RELEASE_VERSION={version}\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-${{ vars.GARAGE_DISTILLER_UPDATE_PUBLIC_KEY_HEX }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package native application
        shell: bash
        run: >-
          python scripts/package_release.py
          --target "${{ matrix.target }}"
          --version "$RELEASE_VERSION"
          --binary "target/${{ matrix.target }}/release/garage-distiller${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned archive signer
        run: cargo install zipsign --version 0.2.2 --locked
      - name: Sign archives and verify the configured key
        env:
          UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.GARAGE_DISTILLER_UPDATE_PRIVATE_KEY_BASE64 }}
          UPDATE_PUBLIC_KEY_HEX: ${{ vars.GARAGE_DISTILLER_UPDATE_PUBLIC_KEY_HEX }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, tempfile
          archives = sorted(pathlib.Path('dist').glob('*.zip'))
          assert len(archives) == 3, 'All three platform archives must exist'
          secret = os.environ['UPDATE_PRIVATE_KEY_BASE64']
          assert secret, 'Configure GARAGE_DISTILLER_UPDATE_PRIVATE_KEY_BASE64'
          with tempfile.TemporaryDirectory() as directory:
              private = pathlib.Path(directory) / 'private.key'
              public = pathlib.Path(directory) / 'public.key'
              private.write_bytes(base64.b64decode(secret, validate=True))
              private.chmod(0o600)
              public.write_bytes(bytes.fromhex(os.environ['UPDATE_PUBLIC_KEY_HEX']))
              for archive in archives:
                  subprocess.run(['zipsign', 'sign', 'zip', str(archive), str(private)], check=True)
                  subprocess.run(['zipsign', 'verify', 'zip', str(archive), str(public)], check=True)
          checksums = ''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n' for p in archives)
          pathlib.Path('dist/SHA256SUMS').write_text(checksums)
          PY
      - name: Publish all platforms atomically through a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Garage Distiller $RELEASE_TAG" --generate-notes dist/*.zip dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
