plugins { id 'com.android.application' }

def cargoVersion = new File(rootDir.parentFile, 'Cargo.toml').text.find(/(?m)^version = "([^"]+)"/) { full, version -> version }
def versionParts = cargoVersion.tokenize('.').collect { it.toInteger() }
android {
    namespace 'fr.francoispeyret.garagedistiller'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'fr.francoispeyret.garagedistiller'
        minSdk 26
        targetSdk 35
        versionCode versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
        versionName cargoVersion
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        localBuild {
            storeFile file(System.getenv('ANDROID_KEYSTORE') ?: '../../.tools/android-signing/local-build.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'garage-distiller-local'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.localBuild
        }
    }
    // Native debug symbols are already stripped by the Rust release profile.
    packaging { jniLibs { useLegacyPackaging = false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// android-activity 0.6.1 compiles the native GameActivity implementation itself.
// Keep only Java classes/resources from the matching AAR to avoid a second glue library.
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.games:games-activity:4.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
